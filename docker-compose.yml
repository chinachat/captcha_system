version: "3.8"

services:
  captcha:
    build:
      context: .
      # 基础镜像源自动选择：默认国内 daocloud；可用 build.sh 或
      # 设置环境变量 BASE_IMAGE=registry.cn-hangzhou.aliyuncs.com/library/python:3.12-slim
      # 或 BASE_IMAGE=python:3.12-slim（官方 Docker Hub）覆盖
      args:
        BASE_IMAGE: ${BASE_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
    ports:
      - "${CAPTCHA_PORT:-8080}:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - ENV=production
      # 以下凭据从 .env 读取（.env 不入库，修改后 docker compose up -d 生效）。
      # 缺失时由应用层 ENV=production 的 fail-fast 校验拒绝启动，防止默认凭据上线
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS}
      - DEFAULT_API_KEY=${DEFAULT_API_KEY}
      - RATE_LIMIT_GENERATE=30
      - CAPTCHA_EXPIRE=120
      # 可信代理 IP（反向代理场景下填写，仅当请求真实来源 IP 命中时才信任 X-Forwarded-For）
      # - TRUSTED_PROXIES=127.0.0.1
      # 启用 Redis 时取消下面两行注释，并启用下方 redis 服务
      # - REDIS_URL=redis://redis:6379/0
      - DB_PATH=/data/captcha.db
    volumes:
      - captcha_data:/data
    restart: unless-stopped
    # depends_on:
    #   - redis

  # 可选 Redis（取消注释并设置上面的 REDIS_URL）
  # redis:
  #   image: docker.m.daocloud.io/library/redis:7-alpine
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data

volumes:
  captcha_data:
  # redis_data:
