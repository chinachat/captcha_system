version: "3.8"

services:
  captcha:
    build:
      context: .
      # 基础镜像源自动选择：默认国内 daocloud；可用 build.sh 或
      # 设置环境变量 BASE_IMAGE=registry.cn-hangzhou.aliyuncs.com/library/python:3.12-slim
      # 或 BASE_IMAGE=python:3.12-slim（官方 Docker Hub）覆盖
      args:
        BASE_IMAGE: ${BASE_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - ENV=production
      # 以下三项为必填：ENV=production 下使用默认/占位值将拒绝启动（fail-fast）
      - SECRET_KEY=change-this-to-a-long-random-string
      - ADMIN_USER=admin
      - ADMIN_PASS=your-strong-password
      - DEFAULT_API_KEY=demo-api-key-captcha-2026
      - RATE_LIMIT_GENERATE=30
      - CAPTCHA_EXPIRE=120
      # 可信代理 IP（反向代理场景下填写，仅当请求真实来源 IP 命中时才信任 X-Forwarded-For）
      # 例如: "192.168.1.0/24,127.0.0.1"
      # - TRUSTED_PROXIES=127.0.0.1
      # 启用 Redis 时取消下面两行注释，并启用下方 redis 服务
      # - REDIS_URL=redis://redis:6379/0
      - DB_PATH=/data/captcha.db
    volumes:
      - captcha_data:/data
    restart: unless-stopped
    # depends_on:
    #   - redis

  # 可选 Redis（取消注释并设置上面的 REDIS_URL）
  # redis:
  #   image: docker.m.daocloud.io/library/redis:7-alpine
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data

volumes:
  captcha_data:
  # redis_data:
