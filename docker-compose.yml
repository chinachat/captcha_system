version: "3.8"

services:
  captcha:
    # 直接拉取 GHCR 预构建镜像（多架构 amd64/arm64，无需本地构建；armv7 需本地 ./build.sh）。
    # 本地构建模式：注释掉 image 行，改回如下 build 配置后 docker compose up -d --build：
    # build:
    #   context: .
    #   args:
    #     BASE_IMAGE: ${BASE_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
    image: ghcr.io/chinachat/captcha_system:latest
    ports:
      - "${CAPTCHA_PORT:-8080}:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - ENV=production
      # 以下凭据从 .env 读取（.env 不入库，修改后 docker compose up -d 生效）。
      # 未设置或为空时 compose 直接报错退出（fail-fast），防止空凭据/默认凭据上线
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY 未设置：请先 cp .env.example .env 并填写强随机值}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:?ADMIN_PASS 未设置：请先在 .env 中填写}
      - DEFAULT_API_KEY=${DEFAULT_API_KEY:?DEFAULT_API_KEY 未设置：请先在 .env 中填写}
      - RATE_LIMIT_GENERATE=30
      - CAPTCHA_EXPIRE=120
      # 可信代理 IP/CIDR（从 .env 读取，如 TRUSTED_PROXIES=127.0.0.1,192.168.1.0/24）。
      # 仅当请求真实来源 IP 命中时才信任 X-Forwarded-For，防止客户端伪造绕过限流
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # 启用 Redis 时取消下面两行注释，并启用下方 redis 服务
      # - REDIS_URL=redis://redis:6379/0
      # 启用 PostgreSQL 时取消注释并启用下方 postgres 服务（否则使用 SQLite）
      # - DATABASE_URL=postgresql://captcha:${POSTGRES_PASSWORD}@postgres:5432/captcha
      - DB_PATH=/data/captcha.db
    volumes:
      - captcha_data:/data
    restart: unless-stopped
    # depends_on:
    #   - redis

  # 可选 Redis（取消注释并设置上面的 REDIS_URL）
  # redis:
  #   image: docker.m.daocloud.io/library/redis:7-alpine
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data

  # 可选 PostgreSQL（取消注释、在 .env 设置 POSTGRES_PASSWORD 并启用上面的 DATABASE_URL）
  # postgres:
  #   image: docker.m.daocloud.io/library/postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_DB=captcha
  #     - POSTGRES_USER=captcha
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置：请先在 .env 中填写}
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data

volumes:
  captcha_data:
  # redis_data:
  # pg_data:
