# GHCR 多架构镜像自动构建发布（amd64 / arm64 / armv7）
# 推送 main 或 v* tag 时自动构建并推送到 ghcr.io/chinachat/captcha_system，
# 用户部署直接 docker pull / docker compose up，无需本地构建。
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 推送 GHCR 镜像必需
    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR（内置 GITHUB_TOKEN，无需额外密钥）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chinachat/captcha_system
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - name: 构建并推送（amd64 / arm64 / armv7）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # CI 在 GitHub 国际网络，必须用官方基础镜像（Dockerfile 默认 daocloud 国内源不可达）
          build-args: |
            BASE_IMAGE=python:3.12-slim

      - name: 设置包可见性为 public（失败不影响镜像推送）
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/orgs/chinachat/packages/container/captcha_system/visibility \
            -d '{"visibility":"public"}' \
            && echo "包已设为 public" \
            || echo "可见性设置失败：首次需在 https://github.com/orgs/chinachat/packages 手动设为 public"
